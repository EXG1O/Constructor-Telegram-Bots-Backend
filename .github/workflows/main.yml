name: Main CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  SECRET_KEY: test_secret_key
  APP_URL: 'http://localhost'
  REDIS_URL: redis://localhost:6379
  PG_DATABASE_NAME: postgres
  PG_DATABASE_USER: postgres
  PG_DATABASE_PASSWORD: postgres
  PG_DATABASE_HOST: localhost
  PG_DATABASE_PORT: 5432
  FRONTEND_PATH: ''
  TELEGRAM_LOGIN_CLIENT_ID: 123456789
  TELEGRAM_LOGIN_CLIENT_SECRET: test_secret
  TELEGRAM_BOTS_HUB_REDIS_URL: redis://localhost:6379/1
  PLATFORM_BOT_SERVICE_TOKEN: 123456789
  PLATFORM_BOT_MICROSERVICE_TOKEN: 987654321

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check && uv run ruff format --check

      - name: Run mypy
        run: uv run mypy .
  tests:
    name: Run Tests
    needs: code-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Run tests
        run: uv run manage.py test --verbosity 3
